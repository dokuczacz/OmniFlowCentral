name: CI Tests

on:
  pull_request:
  push:
    branches:
      - 'feature/**'

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r OmniFlowCentral/requirements.txt pytest pytest-mock requests
      - name: Run unit tests
        run: pytest tests/unit -q

  integration:
    name: Integration smoke tests
    needs: unit
    env:
      AZURE_FUNCTIONS_HOST_URL: ${{ secrets.AZURE_FUNCTIONS_HOST_URL }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate integration tests (skip if secrets missing)
        id: gate
        shell: bash
        run: |
          if [ -n "${AZURE_FUNCTIONS_HOST_URL}" ] && [ -n "${AZURE_STORAGE_CONNECTION_STRING}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice
        if: ${{ steps.gate.outputs.run != 'true' }}
        run: echo "Skipping integration tests (missing AZURE_FUNCTIONS_HOST_URL or AZURE_STORAGE_CONNECTION_STRING)."

      - uses: actions/checkout@v4
        if: ${{ steps.gate.outputs.run == 'true' }}
      - uses: actions/setup-python@v4
        if: ${{ steps.gate.outputs.run == 'true' }}
        with:
          python-version: '3.11'
      - name: Install deps
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r OmniFlowCentral/requirements.txt pytest pytest-mock requests
      - name: Run integration tests
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: pytest tests/integration -q
