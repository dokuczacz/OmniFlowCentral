openapi: 3.1.0
info:
  title: OmniFlow Central GPT Tools (Minimal)
  version: 0.5.0
  description: >-
    OpenAPI schema for OmniFlow Central Custom GPT tools.
    This schema intentionally exposes only the GPT-only endpoints and only the dataset tools:
    - query_dataset
    - dataset_search

    BEST PRACTICES:
    - Use query_dataset with fetch_content=true only after confirming pageId/recordIndex.
    - For large acts (kodeksy), use content_slice to request bounded excerpts.
    - Available dataset: eli_acts (Polish legislation)
servers:
  - url: https://omniflowcentral-bagkbfera7d0hncc.switzerlandnorth-01.azurewebsites.net
components:
  securitySchemes:
    functionKey:
      type: apiKey
      in: header
      name: x-functions-key
      description: Azure Functions host key (required on every request).
  schemas:
    CapabilitiesResponse:
      type: object
      properties:
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
      required:
        - capabilities
      additionalProperties: false
    Capability:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        method:
          type: string
        params:
          type: object
          additionalProperties:
            type: string
      required:
        - name
        - description
        - method
        - params
      additionalProperties: false
    ToolCallRequest:
      type: object
      description: >-
        GPT-only dispatcher request (flattened shape for maximum Custom GPT Actions compatibility).
        Note: OmniFlow backend also accepts a nested `params` object, but this OpenAPI intentionally
        uses the flattened shape because some Action dispatchers treat `params` as kwargs.
      properties:
        tool:
          type: string
          enum: [query_dataset, dataset_search]
        user_id:
          type: string
          description: Optional user scope (defaults to `public` on the GPT endpoint).

        # query_dataset fields (ELI only)
        dataset:
          type: string
          enum: [eli_acts]
          description: Dataset name (required when tool=query_dataset).
        q:
          type: string
          description: Optional text query (literal substring match across indexed metadata).
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of entries to return.
        fetch_content:
          type: boolean
          description: When true, fetches act text excerpt (bounded) after confirmation.
        year:
          type: integer
          description: "Optional filter: publication year of the act."
        publisher:
          type: string
          description: "Optional filter: publisher (DU/MP)."
        status:
          type: string
          description: "Optional filter: status of the act."
        pageId:
          type: string
          description: Deterministic ELI id like "DU/1997/553" or "MP/2025/123".
        recordIndex:
          type: integer
          description: Deterministic index for ELI acts (`pos`).
        content_slice:
          type: object
          description: Optional excerpt control when fetch_content=true (defaults to start=0, length=2048; max length 4096).
          properties:
            start:
              type: integer
              minimum: 0
            length:
              type: integer
              minimum: 1
              maximum: 4096
          additionalProperties: false

        # dataset_search fields (manifest discovery)
        category:
          type: string
          description: "Optional manifest category (recommended: dataset)."
        tags_any:
          type: array
          items:
            type: string
          description: Optional tags filter (any match).
        tags_all:
          type: array
          items:
            type: string
          description: Optional tags filter (all match).
        cursor:
          type: string
          description: Optional cursor token for pagination.
      required:
        - tool
      additionalProperties: false
    ToolCallResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success, error]
        code:
          type: string
          description: Error code (only if status=error)
        message:
          type: string
          description: Error message (only if status=error)
        tool:
          type: string
        user_id:
          type: string
        result:
          type: object
          additionalProperties: true
      required:
        - status
        - tool
        - user_id
      additionalProperties: true
security:
  - functionKey: []
paths:
  /api/tools/gpt/capabilities:
    get:
      operationId: get_capabilities
      summary: List available GPT tools and their parameters.
      security:
        - functionKey: []
      responses:
        '200':
          description: Tool catalog with capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '401':
          description: Missing or invalid function key. Ensure x-functions-key header is set.
  /api/tools/gpt/call:
    post:
      operationId: tools_call_gpt
      summary: Call a supported tool via the GPT-only dispatcher.
      security:
        - functionKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolCallRequest'
            examples:
              query_dataset_eli_confirm:
                value:
                  tool: query_dataset
                  dataset: eli_acts
                  pageId: DU/1997/553
                  fetch_content: false
                  limit: 1
              query_dataset_eli_excerpt:
                value:
                  tool: query_dataset
                  dataset: eli_acts
                  pageId: DU/1997/553
                  fetch_content: true
                  limit: 1
                  content_slice:
                    start: 0
                    length: 4096
              dataset_search:
                value:
                  tool: dataset_search
                  user_id: public
                  category: dataset
                  tags_any: [legal]
                  limit: 20
      responses:
        '200':
          description: Tool response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolCallResponse'
        '400':
          description: Bad request (invalid tool or params).
        '401':
          description: Missing or invalid function key.
